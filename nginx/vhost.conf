server {
    listen 80;
    server_name default_replace_8888;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name default_replace_8888;
    index index.php index.html index.htm;
    root /wwwroot/default_replace_8888;

    location ~ /\. {
        deny all;
    }

    location ~ ^/wp-config\.php$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    rewrite /wp-admin$ $scheme://$host$uri/ permanent;

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    error_log /usr/local/nginx/logs/default_replace_8888.error.log error;
    access_log /usr/local/nginx/logs/default_replace_8888.access.log main;
}
